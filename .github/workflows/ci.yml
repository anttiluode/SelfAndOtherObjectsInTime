name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: pytest -q
      - name: Gate 1 receipt
        run: python experiment.py --assert-gate --seeds 64
      - name: Gate 2 receipt
        run: python gate2_experiment.py --assert-gate --seeds 64
      - name: Gate 3 receipt
        run: python gate3_experiment.py --assert-gate --seeds 64
      - name: Gate 4 receipt
        run: python gate4_experiment.py --assert-gate --seeds 64
      - name: Gate 5 receipt
        run: python gate5_experiment.py --assert-gate --seeds 64
      - name: Gate 6 receipt
        run: python gate6_experiment.py --assert-gate --seeds 64
      - name: Gate 7 receipt
        run: python gate7_experiment.py --assert-gate --seeds 64
